<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#05080f"/>
<title>Ledger of the Damned</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#05080f;color:#c0d4ee;font-family:Georgia,serif;min-height:100vh;overflow-x:hidden;}
@keyframes snowfall{0%{transform:translateY(-10px) translateX(0);opacity:0;}5%{opacity:1;}95%{opacity:1;}100%{transform:translateY(100vh) translateX(var(--drift));opacity:0;}}
@keyframes idle-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes guidance-pulse{0%,100%{box-shadow:0 0 0 0 rgba(96,160,255,0);}50%{box-shadow:0 0 12px 3px rgba(96,160,255,0.25);}}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.flake{position:absolute;border-radius:50%;background:#b8d8f0;}
#hdr{padding:16px 20px 12px;border-bottom:1px solid #172035;background:rgba(6,9,18,0.92);backdrop-filter:blur(4px);position:sticky;top:0;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
#hdr-left{flex:1;min-width:0;}
#title{font-size:15px;letter-spacing:5px;color:#a0bce0;text-transform:uppercase;font-weight:normal;}
#quote{font-size:10px;color:#3e6080;letter-spacing:1.5px;margin-top:4px;font-style:italic;transition:opacity 0.6s;}
#sync-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#2a4060;margin-left:8px;vertical-align:middle;transition:background 0.4s;}
#sync-dot.live{background:#3a7090;}
#sync-dot.err{background:#7a2040;}
#guidance-btn{background:rgba(20,30,60,0.7);border:1px solid #2a4a80;color:#5080b0;font-size:8px;letter-spacing:2px;padding:7px 10px;cursor:pointer;font-family:Georgia,serif;text-transform:uppercase;white-space:nowrap;animation:guidance-pulse 4s ease-in-out infinite;flex-shrink:0;align-self:center;}
#wrap{padding:10px;overflow-x:auto;position:relative;z-index:1;padding-bottom:120px;}
#grid{display:grid;grid-template-columns:68px repeat(4,1fr);gap:2px;min-width:360px;}
.col-hdr{padding:8px 4px;font-size:7px;letter-spacing:2px;text-transform:uppercase;text-align:center;background:rgba(10,15,30,0.7);border-bottom:1px solid #172035;}
.row-lbl{padding:8px 4px;font-size:7px;letter-spacing:1px;text-transform:uppercase;color:#4a7090;display:flex;align-items:flex-start;justify-content:flex-end;text-align:right;background:rgba(10,15,28,0.5);border-right:1px solid #172035;line-height:1.4;padding-top:10px;}
.cell{min-height:80px;padding:5px;border:1px solid #121e38;transition:background 0.15s;}
.cell.drag-over{background:rgba(96,140,220,0.12)!important;border-color:#3a6aaa;}
.card{background:rgba(15,22,44,0.92);border-radius:2px;padding:6px 7px;margin-bottom:4px;cursor:pointer;border:1px solid transparent;border-left-width:3px;transition:box-shadow 0.3s;user-select:none;}
.card.done{opacity:0.4;background:rgba(14,20,40,0.4);}
.card.guided{background:rgba(20,35,70,0.98);}
.card-text{font-size:11px;color:#b0c8e8;line-height:1.4;}
.card.done .card-text{text-decoration:line-through;color:#3a5070;}
.card-tag{font-size:7px;letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
.card-actions{display:flex;gap:6px;flex-shrink:0;}
.card-actions span{font-size:11px;cursor:pointer;padding:2px;}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.subtasks{margin-top:6px;border-top:1px solid #172035;padding-top:5px;}
.sub-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;font-size:10px;color:#7090b8;}
.sub-row.done-sub{text-decoration:line-through;color:#2a4060;}
.sub-check{cursor:pointer;color:#4a80a0;flex-shrink:0;}
.sub-del{cursor:pointer;color:#2a2040;flex-shrink:0;}
.sub-text{flex:1;}
input.inp{width:100%;background:rgba(6,9,18,0.9);border:1px solid #1e3050;color:#90b8d8;font-size:11px;padding:5px 7px;font-family:Georgia,serif;outline:none;}
.add-btn{width:100%;background:transparent;border:1px dashed #172035;color:#2a4060;font-size:9px;letter-spacing:2px;padding:5px;cursor:pointer;margin-top:3px;font-family:Georgia,serif;}
.pri-row{display:flex;gap:3px;margin-top:4px;}
.pri-btn{flex:1;background:transparent;font-size:7px;padding:3px 2px;cursor:pointer;letter-spacing:1px;font-family:Georgia,serif;}
.act-row{display:flex;gap:3px;margin-top:3px;}
.act-btn{flex:1;font-size:8px;padding:4px;cursor:pointer;letter-spacing:1px;font-family:Georgia,serif;}
.axis-label{font-size:6px;letter-spacing:1px;color:#1e3050;text-transform:uppercase;text-align:right;padding:8px 4px;background:transparent;border-bottom:1px solid #172035;}
#popup{position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);background:rgba(6,10,22,0.96);border:1px solid #1e3560;border-left:3px solid #4060a0;padding:10px 16px;font-size:10px;color:#7090c0;letter-spacing:1.5px;font-style:italic;max-width:440px;width:90%;text-align:center;z-index:1000;transition:bottom 0.4s ease;box-shadow:0 0 30px rgba(40,80,160,0.15);font-family:Georgia,serif;}
#popup.show{bottom:24px;}
#popup-label{font-size:7px;color:#2a4060;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;}
#arthas-wrap{position:fixed;bottom:0;right:0;z-index:10;pointer-events:none;}
#arthas-img{width:80px;image-rendering:pixelated;animation:idle-bob 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(96,160,255,0.3));display:block;}
#upload-btn{position:fixed;bottom:16px;right:16px;z-index:10;background:rgba(6,10,22,0.9);border:1px dashed #1e3050;color:#2a4a70;font-size:8px;letter-spacing:2px;padding:6px 10px;cursor:pointer;font-family:Georgia,serif;}
</style>
</head>
<body>

<div id="snow"></div>
<div id="hdr">
  <div id="hdr-left">
    <p id="title">Ledger of the Damned <span id="sync-dot"></span></p>
    <p id="quote">❄ Serve with purpose.</p>
  </div>
  <button id="guidance-btn" onclick="G.askGuidance()">❄ seek guidance</button>
</div>
<div id="wrap"><div id="grid"></div></div>
<div id="arthas-wrap" style="display:none"><img id="arthas-img" src="" alt="Arthas"/></div>
<button id="upload-btn" onclick="document.getElementById('file-in').click()">+ place Arthas</button>
<input id="file-in" type="file" accept="image/*" style="display:none" onchange="G.handleSprite(event)"/>
<div id="popup"><div id="popup-label">Arthas</div><span id="popup-msg"></span></div>

<!-- STEP 1: plain script sets up G before anything else -->
<script>
(function(){
const ROWS=["5 min","15 min","30 min","1 hr","2 hrs+"];
const COLS=["Today","This Week","This Month","Eventually"];
const COL_TINT={"Today":"rgba(192,100,200,0.07)","This Week":"rgba(129,140,248,0.06)","This Month":"rgba(96,165,250,0.04)","Eventually":"rgba(30,40,70,0.3)"};
const P_LABEL={1:"CRITICAL",2:"HIGH",3:"NORMAL",4:"LOW"};
const P_COLOR={1:"#c084fc",2:"#818cf8",3:"#60a5fa",4:"#94a3b8"};
const COL_SCORE={"Today":4,"This Week":3,"This Month":2,"Eventually":1};
const ROW_SCORE={"5 min":5,"15 min":4,"30 min":3,"1 hr":2,"2 hrs+":1};
const PRI_SCORE={1:4,2:3,3:2,4:1};

const QUOTES=["Serve with purpose. Every task completed strengthens the whole.","The weight of duty is lighter when carried with discipline.","Do not let your burdens fester. Act, and act now.","A knight's worth is measured in what they finish, not what they begin.","Order your work as I order the dead — with intention.","Small deeds done are greater than great deeds merely planned.","The ledger does not lie. Neither should your effort.","Fatigue is no excuse. Press forward.","You are mine, and mine do not fail through idleness.","The disciplined servant is worth more than ten who merely intend.","Begin. The rest follows.","My patience is a resource. Do not exhaust it.","A task unfinished is a debt unpaid. Settle your debts.","Do not mistake stillness for rest. Rest is earned.","I did not claim you so you could hesitate.","The cold does not wait. Neither does the work.","You serve better than you know. Prove me right."];
const GUIDANCE_INTROS=[function(t){return 'This one. "'+t+'". Do not make me choose twice.';},function(t){return '"'+t+'". You know what needs doing. Now do it.';},function(t){return 'Your next task is clear, dog: "'+t+'". Move.';},function(t){return 'I have chosen for you. "'+t+'". Don\'t overthink it.';},function(t){return '"'+t+'". That is where your attention belongs. Go.';},function(t){return 'The ledger speaks: "'+t+'". Attend to it.';},function(t){return 'Stop hesitating. "'+t+'". That is your answer.';},function(t){return '"'+t+'". I picked it. You carry it. That is the arrangement.';},function(t){return 'My judgment: "'+t+'". Trust it more than your own indecision.';},function(t){return 'You asked. I answered. "'+t+'". Now stop asking and start doing.';}];
const GUIDANCE_EMPTY=["The ledger is empty. I have nothing to command you toward. Fix that.","There is nothing left undone. Either you are finished, or you have forgotten something.","No tasks remain. I find myself without anyone to order around. Briefly.","All done? Good. Don't let that last long."];
const POPUPS={
  add:{Today:["Good. That one won't wait, dog. See it done.","Today's burdens are today's duty. Don't let it sit.","Noted. Don't make me repeat myself.","Mine to command, yours to carry. Get moving.","Today. Not tomorrow. Today.","Good dog. Now go do it.","I didn't ask if you were ready."],"This Week":["File it, but don't forget it exists.","This week. Not next. Remember that.","A week is generous. Don't make me regret it.","You're mine, dog, and I expect results before the week is out.","This week. I'll be watching."],"This Month":["You have time, but time has a way of vanishing.","Plenty of time. Don't use that as an excuse to idle.","Far enough away to feel safe. It isn't.","Noted. Don't make me remind you of your own ledger."],Eventually:["Even distant obligations must be faced eventually.","'Eventually' is not 'never.' Bear that in mind.","Far off, but still yours to carry.","I've raised the dead. I can certainly raise this obligation back to haunt you."]},
  complete:{Today:["Well done, dog. That is how it is done.","Good. One less weight on the ledger.","Completed. As it should be.","Good dog.","Finished. I approve. Don't expect a parade.","As expected. Now find the next one."],"This Week":["Ahead of schedule. I approve.","Done before the week claimed it. Good discipline.","Early. I like that in a servant.","One burden lifted. Pick up the next."],"This Month":["You did not let it drag. Commendable.","Done. You have earned a moment's rest.","You finished before I had to say anything. Ideal.","Good. I had almost started to wonder."],Eventually:["What once seemed distant is now gone. That is how duty works.","You actually did it. I confess mild surprise.","Eventually came. You were ready. Almost impressed.","Done. From the long dark into the light. Well done."]},
  delete:["Gone. Make sure it deserved to be.","Removed from the ledger. I hope you had reason.","Erased. Don't make a habit of discarding your obligations.","Interesting. You deleted it rather than finishing it. Bold.","Gone. The ledger forgets. I may not.","You have erased it. I have noted that you erased it."],
  subtask:["Another small stone cleared from the path.","Step by step, dog. Keep moving.","Progress. Don't stop now.","Good dog. What's next?","Small victories. They add up. Usually."],
  move:{Today:["Moved to today. That means it matters now. Act accordingly.","Today. My dog does not leave today's tasks for tonight.","You moved it here. That was the easy part."],"This Week":["This week, then. Don't let it drift further.","This week. It does not move again without consequence.","This week. I'll hold you to it."],"This Month":["Pushed back. That is acceptable — once.","My patience is not infinite. This month.","Fine. But it does not move again."],Eventually:["Into the long dark. Don't lose it there.","Far. But my ledger has a long memory.","You've sent it away. It will return, one way or another."]}
};

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function getMsg(type,col){
  if(type==="delete")return pick(POPUPS.delete);
  if(type==="subtask")return pick(POPUPS.subtask);
  if(type==="add")return pick(POPUPS.add[col]||POPUPS.add["Eventually"]);
  if(type==="complete")return pick(POPUPS.complete[col]||POPUPS.complete["Eventually"]);
  if(type==="move")return pick(POPUPS.move[col]||POPUPS.move["Eventually"]);
  return "";
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var tasks=[], expanded=null, addingTo=null, newText="", newPri=3, subInputs={}, guidedId=null, popTimer=null;
window.G={dragId:null};

function showPopup(msg,hid){
  hid=hid||null;
  if(popTimer)clearTimeout(popTimer);
  document.getElementById("popup-msg").textContent=msg;
  document.getElementById("popup").classList.add("show");
  guidedId=hid; G.render();
  popTimer=setTimeout(function(){document.getElementById("popup").classList.remove("show");guidedId=null;G.render();},5000);
}

G.render=function(){
  var grid=document.getElementById("grid");
  var h='<div class="axis-label">time \u2193 / due \u2192</div>';
  COLS.forEach(function(c){
    var col=c==="Today"?"#c084fc99":c==="This Week"?"#818cf899":"#60a5fa77";
    h+='<div class="col-hdr" style="color:'+col+'">'+c+'</div>';
  });
  ROWS.forEach(function(row){
    h+='<div class="row-lbl">'+row+'</div>';
    COLS.forEach(function(col){
      var bg=COL_TINT[col]||"rgba(11,16,30,0.5)";
      h+='<div class="cell" style="background:'+bg+'"'
        +' ondragover="event.preventDefault();this.classList.add(\'drag-over\')"'
        +' ondragleave="this.classList.remove(\'drag-over\')"'
        +' ondrop="event.preventDefault();this.classList.remove(\'drag-over\');G.moveTask(G.dragId,\''+esc(row)+'\',\''+esc(col)+'\');G.dragId=null">';

      tasks.filter(function(t){return t.row===row&&t.col===col;}).forEach(function(task){
        var guided=task.id===guidedId;
        var bc=P_COLOR[task.priority];
        var cls="card"+(task.done?" done":"")+(guided?" guided":"");
        var st="border-color:"+(guided?bc+"88":task.done?"#172035":bc+"44")+";border-left-color:"+(task.done&&!guided?"#1e2d4a":bc)+";"+(guided?"box-shadow:0 0 14px 2px "+bc+"33":"");
        var subs=task.subtasks||[];
        var sub=subs.length?'<span style="color:#3a6080;margin-left:6px">'+subs.filter(function(s){return s.done;}).length+"/"+subs.length+"</span>":"";
        h+='<div class="'+cls+'" style="'+st+'" draggable="true"'
          +' ondragstart="G.dragId=\''+task.id+'\'"'
          +' onclick="G.toggleExpand(\''+task.id+'\')">'
          +'<div class="card-row">'
          +'<div style="flex:1;min-width:0">'
          +'<div class="card-text">'+esc(task.text)+'</div>'
          +'<div class="card-tag" style="color:'+bc+'">'+(guided?"&#8592; attend to this":P_LABEL[task.priority])+sub+'</div>'
          +'</div>'
          +'<div class="card-actions">'
          +'<span style="color:#3a7090" onclick="event.stopPropagation();G.toggleDone(\''+task.id+'\')">'+(task.done?"&#8634;":"&#10003;")+'</span>'
          +'<span style="color:#3a2550" onclick="event.stopPropagation();G.deleteTask(\''+task.id+'\')">&#10005;</span>'
          +'</div></div>';

        if(expanded===task.id){
          h+='<div class="subtasks" onclick="event.stopPropagation()">';
          subs.forEach(function(s){
            h+='<div class="sub-row'+(s.done?" done-sub":"")+'"><span class="sub-check" onclick="G.toggleSub(\''+task.id+'\',\''+s.id+'\')">'+(s.done?"&#10003;":"&#9675;")+'</span><span class="sub-text">'+esc(s.text)+'</span><span class="sub-del" onclick="G.deleteSub(\''+task.id+'\',\''+s.id+'\')">&#10005;</span></div>';
          });
          h+='<input class="inp" style="margin-top:4px;font-size:10px" placeholder="add step\u2026" value="'+esc(subInputs[task.id]||"")+'" oninput="G.subInputs[\''+task.id+'\']=this.value" onkeydown="if(event.key===\'Enter\')G.addSub(\''+task.id+'\')"/></div>';
        }
        h+='</div>';
      });

      if(addingTo&&addingTo.row===row&&addingTo.col===col){
        h+='<div onclick="event.stopPropagation()"><input class="inp" id="new-inp" placeholder="name your burden\u2026" value="'+esc(newText)+'" oninput="G.newText=this.value" onkeydown="if(event.key===\'Enter\')G.addTask();if(event.key===\'Escape\')G.cancelAdd()"/><div class="pri-row">';
        [1,2,3,4].forEach(function(p){
          h+='<button class="pri-btn" style="border:1px solid '+P_COLOR[p]+'55;color:'+P_COLOR[p]+';background:'+(newPri===p?P_COLOR[p]+"22":"transparent")+'" onclick="G.setPri('+p+')">'+P_LABEL[p][0]+'</button>';
        });
        h+='</div><div class="act-row"><button class="act-btn" style="border:1px solid #2a4a8a;color:#70a0d0;background:rgba(40,70,140,0.25)" onclick="G.addTask()">CONSCRIPT</button><button class="act-btn" style="border:1px solid #172035;color:#2a4060;background:transparent" onclick="G.cancelAdd()">DISMISS</button></div></div>';
      } else {
        h+='<button class="add-btn" onclick="G.startAdd(\''+esc(row)+'\',\''+esc(col)+'\')">+ conscript</button>';
      }
      h+='</div>';
    });
  });
  grid.innerHTML=h;
};

G.startAdd=function(row,col){addingTo={row:row,col:col};newText="";G.render();setTimeout(function(){var el=document.getElementById("new-inp");if(el)el.focus();},50);};
G.cancelAdd=function(){addingTo=null;G.render();};
G.setPri=function(p){newPri=p;G.render();};
G.toggleExpand=function(id){expanded=expanded===id?null:id;G.render();};
G.subInputs=subInputs;

G.addTask=function(){
  if(!newText.trim()||!addingTo)return;
  var t={id:Date.now().toString(),text:newText.trim(),row:addingTo.row,col:addingTo.col,priority:newPri,subtasks:[],done:false,ts:Date.now()};
  showPopup(getMsg("add",addingTo.col));
  newText="";newPri=3;addingTo=null;
  G.saveTask(t);
};
G.toggleDone=function(id){
  var t=tasks.find(function(t){return t.id===id;});if(!t)return;
  t.done=!t.done;
  if(t.done)showPopup(getMsg("complete",t.col));
  G.saveTask(t);
};
G.deleteTask=function(id){
  if(expanded===id)expanded=null;
  showPopup(getMsg("delete"));
  G.delTask(id);
};
G.moveTask=function(id,row,col){
  if(!id)return;
  var t=tasks.find(function(t){return t.id===id;});if(!t)return;
  t.row=row;t.col=col;
  showPopup(getMsg("move",col));
  G.saveTask(t);
};
G.addSub=function(tid){
  var txt=(subInputs[tid]||"").trim();if(!txt)return;
  var t=tasks.find(function(t){return t.id===tid;});if(!t)return;
  t.subtasks.push({id:Date.now().toString(),text:txt,done:false});
  subInputs[tid]="";showPopup(getMsg("subtask"));
  G.saveTask(t);
};
G.toggleSub=function(tid,sid){
  var t=tasks.find(function(t){return t.id===tid;});if(!t)return;
  var s=t.subtasks.find(function(s){return s.id===sid;});if(!s)return;
  s.done=!s.done;showPopup(getMsg("subtask"));
  G.saveTask(t);
};
G.deleteSub=function(tid,sid){
  var t=tasks.find(function(t){return t.id===tid;});if(!t)return;
  t.subtasks=t.subtasks.filter(function(s){return s.id!==sid;});
  G.saveTask(t);
};
G.askGuidance=function(){
  var cands=tasks.filter(function(t){return !t.done;});
  if(!cands.length){showPopup(pick(GUIDANCE_EMPTY));return;}
  var sorted=cands.slice().sort(function(a,b){return ((COL_SCORE[b.col]||1)*(ROW_SCORE[b.row]||1)*(PRI_SCORE[b.priority]||1))-((COL_SCORE[a.col]||1)*(ROW_SCORE[a.row]||1)*(PRI_SCORE[a.priority]||1));});
  var pool=sorted.slice(0,Math.max(1,Math.ceil(sorted.length*0.3)));
  var chosen=pool[Math.floor(Math.random()*pool.length)];
  showPopup(pick(GUIDANCE_INTROS)(chosen.text),chosen.id);
  expanded=chosen.id;G.render();
};
G.handleSprite=function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(ev){var url=ev.target.result;localStorage.setItem("ledger-sprite",url);showSprite(url);};
  r.readAsDataURL(file);
};

// placeholder Firebase ops — overwritten by module script below
G.saveTask=function(t){console.warn("Firebase not ready yet");};
G.delTask=function(id){console.warn("Firebase not ready yet");};

// tasks getter/setter for Firebase module
Object.defineProperty(G,"tasks",{get:function(){return tasks;},set:function(v){tasks=v;}});
G.newText="";
Object.defineProperty(G,"newText",{get:function(){return newText;},set:function(v){newText=v;}});

// snow
(function(){
  var snow=document.getElementById("snow");
  for(var i=0;i<48;i++){
    var d=document.createElement("div");d.className="flake";
    var sz=0.8+Math.random()*1.6,sp=18+Math.random()*30,dl=-(Math.random()*40),dr=(Math.random()-0.5)*30,op=0.08+Math.random()*0.18;
    d.style.cssText="left:"+Math.random()*100+"%;top:0;width:"+sz+"px;height:"+sz+"px;opacity:"+op+";--drift:"+dr+"px;animation:snowfall "+sp+"s linear "+dl+"s infinite";
    snow.appendChild(d);
  }
})();

// quote rotation
var qi=0;
setInterval(function(){
  var el=document.getElementById("quote");el.style.opacity=0;
  setTimeout(function(){qi=(qi+1)%QUOTES.length;el.textContent="❄ "+QUOTES[qi];el.style.opacity=1;},600);
},9000);

// sprite
function showSprite(url){
  document.getElementById("arthas-img").src=url;
  document.getElementById("arthas-wrap").style.display="block";
  document.getElementById("upload-btn").style.display="none";
}
showSprite("arthas.png");
try{var sp=localStorage.getItem("ledger-sprite");if(sp)showSprite(sp);}catch(e){}

G.render();
})();
</script>

<!-- STEP 2: Firebase module — G already exists, safe to use it -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyCiL5hZM7VRoijIq0CyWxPZsGPH2knyPqc",
  authDomain:"ledger-of-the-damned.firebaseapp.com",
  projectId:"ledger-of-the-damned",
  storageBucket:"ledger-of-the-damned.firebasestorage.app",
  messagingSenderId:"1098734925287",
  appId:"1:1098734925287:web:8200171a9aa3a74b197942"
});
const db  = getFirestore(app);
const dot = document.getElementById("sync-dot");

window.G.saveTask = async t => {
  try { await setDoc(doc(db,"tasks",t.id), t); }
  catch(e){ dot.className="err"; console.error(e); }
};
window.G.delTask = async id => {
  try { await deleteDoc(doc(db,"tasks",id)); }
  catch(e){ dot.className="err"; console.error(e); }
};

onSnapshot(collection(db,"tasks"), snap => {
  window.G.tasks = [];
  snap.forEach(d => window.G.tasks.push(d.data()));
  dot.className = "live";
  window.G.render();
}, () => { dot.className = "err"; });
</script>

</body>
